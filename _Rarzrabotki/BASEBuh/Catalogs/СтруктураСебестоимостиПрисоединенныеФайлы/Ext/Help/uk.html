<h1>Довідник "Приєднані файли (Структура собівартості)"</h1>
<p>Зберігає вихідні файли (Excel), на підставі яких введено структуру собівартості: на всю структуру або на окремий модуль (див. табличну частину «Файли підстави»). Довідник службовий.</p></body></html>
