<h1>Справочник "Присоединенные файлы (Структура себестоимости)"</h1>
<p>Хранит исходные файлы (Excel), на основании которых введена структура себестоимости: на всю структуру или на отдельный модуль (см. табличную часть «Файлы основания»). Справочник служебный.</p></body></html>
