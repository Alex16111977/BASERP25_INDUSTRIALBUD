[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_olap"
version = "0.1.0"
description = "ETL orchestrator: 1C BAS ERP 2.5 (BaseERP SQL backend) -> OlapBASERP (24 tables) for Power BI"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["ai_olap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
