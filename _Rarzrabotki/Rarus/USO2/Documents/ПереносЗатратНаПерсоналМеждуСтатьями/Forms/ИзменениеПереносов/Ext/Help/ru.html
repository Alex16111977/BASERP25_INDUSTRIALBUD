<h1>Редактирование зарплаты сотрудника</h1>
<p style="MARGIN-LEFT: 0px">В таблице отражается полагающаяся к выплате сумма с дополнительной детализацией (по рабочим местам, подразделениям, месяцам начисления и др.).<br>При необходимости можно отредактировать как сами суммы, так и их распределение по разрезам учета.</p>
