<h1>Распределение возвратных отходов</h1>
<p style="MARGIN-LEFT: 0px">Документ предназначен для распределения возвратных отходов, возникших при производстве продукции. При проведении документа производится распределение возвратных отходов, возникших при производстве продукции, на себестоимость производимой продукции.</p>
