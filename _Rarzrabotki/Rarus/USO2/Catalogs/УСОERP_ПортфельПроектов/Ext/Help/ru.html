<h1 class="">Портфель проектов</h1>
<p>Справочник <strong>"Портфель проектов"</strong> предназначен для объединения инвестиционных проектов и получения консолидированной отчетности по ним.</p>
<p>В табличной части элемента справочника указывается перечень проектов строительства, принадлежащих портфелю проектов.</p></body></html>
