<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN"><html><head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"></meta><link href="v8help://service_book/service_style" type="text/css" rel="stylesheet"></link><meta content="MSHTML 6.00.3790.5662" name="GENERATOR"></meta></head><body>Справочник хранит перечень шаблонов адресов, заполняемых из классификатора.<br>Шаблоны адресов используются при заполнении маршрута доставки непосредственно в документе "Заказ поставщику" и в обработке "Распределение доставки" при формировании "Заказов на доставку".</body></html>
