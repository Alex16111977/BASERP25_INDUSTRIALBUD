<h1>Период</h1>
<p style="MARGIN-LEFT: 0px">Элемент отчета <b>Период</b> предназначен для вывода в отчет периодов. При формировании бюджетного отчета в группировках отчета будут добавлены строки или колонки с заданной периодичностью.</p>
