<h1>Регистр "Заказы грузоотправителей"</h1><font face="Arial"><font size="2">
<p class="Usual"><font face="Verdana" size="0">Регистр </font><font face="Verdana" size="0">предназначен для хранения информации о заказах грузоотправителей. Наличие остатка в данном регистре означает, что заказ не отработан и груз нуждается в обработке. </font></p></font></font></body></html>
