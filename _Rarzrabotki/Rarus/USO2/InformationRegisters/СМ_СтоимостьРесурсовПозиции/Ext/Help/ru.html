<h1>Регистр сведений "Стоимость ресурсов позиции"</h1>
<blockquote dir="ltr" style="MARGIN-RIGHT: 0px">
<p>Предназначен для хранения количественных и стоимостных показателей о расходе ресурсов позиций локальной сметы и актов выполненных работ с учетом всех поправочных коэффициентов.</p></blockquote></body></html>
