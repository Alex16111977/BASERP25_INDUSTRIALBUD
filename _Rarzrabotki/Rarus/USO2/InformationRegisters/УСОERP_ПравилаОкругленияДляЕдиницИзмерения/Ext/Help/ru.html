<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN"><html><head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"></meta><link href="v8help://service_book/service_style" type="text/css" rel="stylesheet"></link><meta content="MSHTML 6.00.3790.5662" name="GENERATOR"></meta></head><body>Регистр хранит правила округления количества в разрезе номенклатуры и единиц измерения при заполнении документа "План потребностей в материалах".<br>Например, для единицы измерения "Тонна" округление может выполняться до 2-х знаков после запятой, а для единицы измерения "Килограмм" - до целых.</body></html>
