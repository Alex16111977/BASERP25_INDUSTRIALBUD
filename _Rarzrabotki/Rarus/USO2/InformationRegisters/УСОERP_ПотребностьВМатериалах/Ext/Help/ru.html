<p>Регистр хранит информацию о требуемых материалах для выполнения работ  по различным сценариям планирования в разрезе:<br> - работа,<br> - материал,<br> - количество на единицу объема,<br> - количество на объем работы.</p>
<p>Запись в регистр формируется на основании данных в справочнике "Строительные работы".</p></body></html>
