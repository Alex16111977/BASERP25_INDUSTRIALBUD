<h1>Обработка "Подмена базы"</h1>
<blockquote dir="ltr" style="MARGIN-RIGHT: 0px">
<p class="Usual">Осуществляет замену сметно-нормативной базы в локальной смете.</p>
<p class="Usual">При изменении базы сохраняются данные о текущих ценах привязанных ресурсов и калькуляциях. </p></blockquote></body></html>
