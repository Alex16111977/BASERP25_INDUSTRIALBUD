<h1>Форма "Очистка данных терминалов"</h1>
<p style="MARGIN-BOTTOM: 18px"></p>
<ul><li>В форме "<strong>Очистка данных терминалов</strong>" необходимо выбрать период и терминал, если терминал не указан, то очистка выполняется по всем терминалам, и нажать "<b>Выполнить очистку</b>". </li></ul><p> </p>
<h3 style="MARGIN-TOP: 0px; MARGIN-BOTTOM: 5px; MARGIN-LEFT: 0px">Смотрите также</h3>
<p style="MARGIN-TOP: 0px; MARGIN-BOTTOM: 5px; MARGIN-LEFT: 20px"><a href="DataProcessor.ItobОчисткаДанныхТерминалов/Help">Обработка "Очистка данных терминалов"</a>.</p></body></html>
