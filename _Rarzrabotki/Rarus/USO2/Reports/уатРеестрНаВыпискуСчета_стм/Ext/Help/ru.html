<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN"><html><head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"></meta><link href="v8help://service_book/service_style" type="text/css" rel="stylesheet"></link><meta content="MSHTML 6.00.3790.5662" name="GENERATOR"></meta></head><body><link href="v8help://service_book/service_style" type="text/css" rel="stylesheet"></link><meta content="MSHTML 6.00.3790.186" name="GENERATOR"></meta><h1><font color="#000080">Отчет "Реестр на выписку счета (стм)"</font></h1>
<p class="Usual">Данный отчет служит для анализа оказанных транспортных услуг по <a href="Catalog.СМ_ОбъектыСтроительства/Help">объектам строительства</a>, для строительной техники и механизмов (СТМ). Отчет можно использовать в качестве реестра-расшифровки к счету за транспортные услуги.</p></body></html>
