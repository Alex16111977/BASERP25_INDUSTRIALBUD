<h2>Назначение</h2>
<p class="Usual">Данный отчет предназначен для получения информации о текущем состоянии выполнения заказов на ТС.</p>
<h2>Примечание</h2>
<p class="Usual">В колонках "Заказано", "Выполнено", "Отменено", "Осталось выполнить" выводятся данные в базовой единице измерения груза.</p></body></html>
