<h1>Отчет "Обороты между субконто"</h1>
<p></p>
<p class="Usual">Отчет предназначен для представления данных по оборотам между списком выбранных субконто и списком корреспондирующих субконто.</p>
<p class="Usual">В отчете можно установить следующие настройки:<br><br><a href="Subsystem.РегламентированныйУчетПодсистемы.Subsystem.СтандартныеОтчеты/Help#Показатели">Показатели</a><br><a href="Subsystem.РегламентированныйУчетПодсистемы.Subsystem.СтандартныеОтчеты/Help#Группировка">Группировка</a><br><a href="Subsystem.РегламентированныйУчетПодсистемы.Subsystem.СтандартныеОтчеты/Help#Отбор">Отбор</a><br><a href="Subsystem.РегламентированныйУчетПодсистемы.Subsystem.СтандартныеОтчеты/Help#Сортировка">Сортировка</a><br><a href="Subsystem.РегламентированныйУчетПодсистемы.Subsystem.СтандартныеОтчеты/Help#ДополнительныеДанные">Дополнительные данные</a><br><a href="Subsystem.РегламентированныйУчетПодсистемы.Subsystem.СтандартныеОтчеты/Help#Оформление">Оформление</a><br></p></body></html>
