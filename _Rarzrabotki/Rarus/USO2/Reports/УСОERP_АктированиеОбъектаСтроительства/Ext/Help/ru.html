<h1>Актирование объекта строительства</h1>
<p class="Usual" style="MARGIN-LEFT: 0px">Отчет показывает информацию, рассчитанную документом «Бюджет строительства».</p>
<p class="Usual" style="MARGIN-LEFT: 0px">В отчет выводится ожидаемый график подписания Актов выполненных работ в разрезе </p>
<p class="Usual" style="MARGIN-LEFT: 0px">статей бюджета, работ утвержденного календарного плана-графика и периодов срока </p>
<p class="Usual" style="MARGIN-LEFT: 0px">выполнения работ.</p></body></html>
