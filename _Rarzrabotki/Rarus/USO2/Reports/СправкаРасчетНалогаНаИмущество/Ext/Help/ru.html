<h1>Расчет налога (авансового платежа по налогу) на имущество</h1>
<p style="MARGIN-LEFT: 0px">Отчет предназначен для обобщения информации о порядке исчисления суммы налога на имущество (или авансового платежа по налогу)</p>
<p style="MARGIN-LEFT: 0px">Отчет необходимо формировать только после выполнения регламентных операций по закрытию месяца.</p>
