<h1>Реестр смет</h1>
<p>Отчет "Реестр смет» предназначен для печати из дерева смет списка смет, отвечающих определенным критериям.<br>В качестве критериев отбора используются: <br>типы смет: локальная, объектная, сводная,<br>дата  создания сметы (период),<br>заказчик,<br>подрядчик,<br>район строительства,<br>метод счета<br></p></body></html>
