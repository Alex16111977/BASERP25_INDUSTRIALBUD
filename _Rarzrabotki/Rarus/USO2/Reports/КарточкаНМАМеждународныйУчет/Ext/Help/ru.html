<h1>Карточка НМА (Международный учет)</h1>
<p style="MARGIN-LEFT: 0px">Карточка НМА показывает основные параметры учета нематериального актива по стандартам международного учета.<br>Отчет можно строить по нескольким выделенным НМА в списке справочника.</p>
